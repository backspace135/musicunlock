name: Windows

on:
  # Branch pushes are covered by their pull request; only main runs on push.
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "tests/fixtures/**"
      - "resources/kgm.mask"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "tests/fixtures/**"
      - "resources/kgm.mask"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2022
    env:
      # Compile through sccache with the Actions cache; CMake reads the launcher from the environment.
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # The runner console is cp1252; the scripts print Chinese messages.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build, run core tests and CLI smoke test (MSVC x64)
        run: python apps/windows/scripts/build.py
      - name: Cache NuGet packages for the app
        uses: actions/cache@v6
        with:
          path: apps/windows/build/packages
          key: winui-packages-${{ hashFiles('apps/windows/app/packages.config') }}
      - name: Build the WinUI 3 app (restore pinned packages, MSBuild)
        run: python apps/windows/scripts/build_app.py
      - name: Stage the slim self-contained app folder
        run: python apps/windows/scripts/stage_app.py
      - name: Live platform checks (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          MUSICUNLOCK_LIVE_TESTS: "1"
        run: apps/windows/build/windows-release/musicunlock_core_tests.exe
      - uses: actions/upload-artifact@v7
        with:
          name: musicunlock-cli-windows-x64
          path: apps/windows/build/windows-release/musicunlock.exe
          if-no-files-found: error
      # The artifact zip holds the folder's contents; the symbols are kept apart for crash analysis.
      - uses: actions/upload-artifact@v7
        with:
          name: musicunlock-app-windows-x64
          path: apps/windows/build/dist/MusicUnlock/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: musicunlock-app-windows-x64-symbols
          path: apps/windows/build/dist/symbols/
          if-no-files-found: error
